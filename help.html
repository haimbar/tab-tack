<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tab Tack — Help</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<style>
  body {
    font-family: system-ui, sans-serif; color: #222; margin: 0;
    padding: 16px 24px 48px; max-width: 760px; position: relative;
  }
  #version {
    position: absolute; top: 16px; right: 24px; font-size: 11px; color: #999;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; color: #2f4b6e; margin: 28px 0 10px; border-bottom: 1px solid #e5e5e5; padding-bottom: 4px; }
  h3 { font-size: 14px; margin: 18px 0 8px; }
  p { line-height: 1.55; margin: 10px 0; }
  code {
    background: #f1f3f6; border-radius: 3px; padding: 1px 5px;
    font-size: 0.92em; font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  pre {
    background: #f1f3f6; border-radius: 4px; padding: 10px 12px;
    overflow-x: auto; font-size: 12.5px; line-height: 1.5;
  }
  pre code { background: none; padding: 0; }
  a { color: #2f4b6e; }
  ul, ol { line-height: 1.55; padding-left: 22px; }
  li { margin: 4px 0; }
  table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border: 1px solid #e5e5e5; }
  th { background: #f7f9fb; }
  #loading, #error { color: #888; font-size: 13px; }
  #error { color: #b3261e; display: none; }
</style>
</head>
<body>
  <div id="version"></div>
  <div id="loading">Loading…</div>
  <div id="error">Couldn't load the README.</div>
  <div id="content"></div>

  <script src="vendor/browser-polyfill.min.js"></script>
  <script src="markdown-lite.js"></script>
  <script src="help.js"></script>
</body>
</html>
