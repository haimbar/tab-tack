<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 340px; padding: 10px; }
  label { display: block; font-size: 12px; font-weight: 600; margin-top: 8px; color: #333; }
  input[type=text], textarea {
    width: 100%; box-sizing: border-box; padding: 4px 6px; font-size: 13px; margin-top: 2px;
  }
  textarea { resize: vertical; min-height: 70px; font-family: inherit; }
  #save { margin-top: 10px; width: 100%; padding: 6px; font-size: 13px; cursor: pointer; }
  #status { margin-top: 6px; font-size: 12px; color: green; height: 14px; }
  #categoryList {
    margin-top: 4px; max-height: 90px; overflow-y: auto;
    border: 1px solid #ccc; border-radius: 3px; padding: 4px 6px;
  }
  #categoryList .cat-row { font-size: 13px; padding: 1px 0; }
  #categoryList .cat-row label { display: inline; font-size: 13px; font-weight: normal; margin: 0 0 0 4px; color: inherit; }
  #categoryList .empty { font-size: 12px; color: #888; }
  #viewSaved {
    display: block; margin-top: 10px; font-size: 12px; text-align: center;
    color: #2f4b6e; text-decoration: none;
  }
  #viewSaved:hover { text-decoration: underline; }
</style>
</head>
<body>
  <label for="title">Title</label>
  <input type="text" id="title">

  <label for="url">URL</label>
  <input type="text" id="url">

  <label for="author">Author (optional)</label>
  <input type="text" id="author">

  <label for="date">Publish date (optional)</label>
  <input type="text" id="date">

  <label>Categories</label>
  <div id="categoryList"></div>
  <input type="text" id="newCategories" placeholder="Add new (comma-separated)">

  <label for="annotation">Your note</label>
  <textarea id="annotation" placeholder="Add your own annotation..." autofocus></textarea>

  <button id="save">Save to markdown file</button>
  <div id="status"></div>
  <a href="#" id="viewSaved">View saved pages &rarr;</a>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
