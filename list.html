<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tab Tack — Saved Items</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px 24px; color: #222; }
  h1 { font-size: 18px; margin: 0 0 12px; display: flex; align-items: baseline; gap: 8px; }
  h1 #version { font-size: 11px; font-weight: normal; color: #999; }
  .toolbar {
    display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap;
  }
  .toolbar input[type=text] {
    padding: 5px 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px;
    min-width: 200px;
  }
  .toolbar select { padding: 5px 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; }
  .toolbar button {
    padding: 5px 10px; font-size: 13px; cursor: pointer; border: 1px solid #2f4b6e;
    background: #2f4b6e; color: white; border-radius: 4px;
  }
  .toolbar button:disabled { opacity: 0.5; cursor: default; }
  .toolbar-divider { width: 1px; align-self: stretch; background: #ccc; margin: 0 2px; }
  .count { font-size: 12px; color: #666; margin-left: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e5e5e5; vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: #666; }
  tr:hover { background: #f7f9fb; }
  .title-link { color: #2f4b6e; font-weight: 600; text-decoration: none; cursor: pointer; }
  .title-link:hover { text-decoration: underline; }
  .url { color: #888; font-size: 11px; word-break: break-all; }
  .url-toggle {
    font-size: 10px; padding: 0 4px; margin-left: 4px; cursor: pointer;
    border: 1px solid #ccc; border-radius: 3px; background: white; color: #666;
    line-height: 1.5; vertical-align: middle;
  }
  .url-toggle:hover { background: #f0f0f0; }
  .meta { color: #555; font-size: 12px; }
  .categories span {
    display: inline-block; background: #e8eef5; color: #2f4b6e; border-radius: 3px;
    padding: 1px 6px; margin: 1px 2px 1px 0; font-size: 11px;
  }
  .annotation { color: #444; font-size: 12px; white-space: pre-wrap; max-width: 260px; }
  .empty { color: #888; padding: 24px; text-align: center; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: #2f4b6e; }
  th.active { color: #2f4b6e; }
  .sort-indicator { margin-left: 3px; }
  .group-header {
    background: #eef3f9; color: #2f4b6e; font-weight: 600; font-size: 12px;
    padding: 6px 8px; border-bottom: 1px solid #d7e2ee;
  }
  .actions { white-space: nowrap; }
  .row-btn {
    font-size: 11px; padding: 3px 8px; margin-right: 4px; cursor: pointer;
    border: 1px solid #ccc; border-radius: 3px; background: white;
  }
  .row-btn:hover { background: #f0f0f0; }
  .row-btn.danger { border-color: #b3261e; color: #b3261e; }
  .row-btn.danger:hover { background: #fbeceb; }

  .edit-cell { background: #fbfcfe; padding: 12px; }
  .edit-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; max-width: 640px; }
  .edit-form .full { grid-column: 1 / -1; }
  .edit-form label { display: block; font-size: 11px; font-weight: 600; color: #555; margin-bottom: 2px; }
  .edit-form input[type=text], .edit-form textarea {
    width: 100%; box-sizing: border-box; padding: 4px 6px; font-size: 13px;
    border: 1px solid #ccc; border-radius: 3px;
  }
  .edit-form textarea { min-height: 60px; resize: vertical; font-family: inherit; }
  #editCategoryList {
    max-height: 80px; overflow-y: auto; border: 1px solid #ccc; border-radius: 3px;
    padding: 4px 6px; font-size: 13px;
  }
  #editCategoryList .cat-row label {
    display: inline; font-size: 13px; font-weight: normal; margin-left: 4px;
  }
  .edit-actions { grid-column: 1 / -1; margin-top: 4px; }
  .edit-actions button {
    padding: 5px 12px; font-size: 13px; cursor: pointer; border-radius: 4px; margin-right: 6px;
  }
  #editSave { border: 1px solid #2f4b6e; background: #2f4b6e; color: white; }
  #editCancel { border: 1px solid #ccc; background: white; }
  .edit-status { font-size: 12px; color: #b3261e; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Tab Tack <span id="version"></span></h1>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search title, URL, author, note...">
    <select id="categoryFilter">
      <option value="">All categories</option>
    </select>
    <button id="openSelected" disabled>Open selected in new tabs</button>
    <span class="toolbar-divider"></span>
    <button id="exportSelected" disabled title="Save the checked entries as a JSON file you can send to someone">Export selected as JSON&hellip;</button>
    <button id="importBtn" title="Load entries from a Tab Tack JSON export file; duplicates (by URL) are skipped">Import&hellip;</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
    <button id="importMarkdownBtn" title="Recover entries from a tab-tack.md export file (e.g. if storage.sync was lost); duplicates (by URL) are skipped">Import from markdown&hellip;</button>
    <input type="file" id="importMarkdownFile" accept="text/markdown,.md" style="display:none;">
    <span class="toolbar-divider"></span>
    <button id="reexport" title="Re-write the markdown file in Downloads from what's currently saved">Download markdown file</button>
    <span id="importStatus" style="font-size:12px;color:#2f4b6e;"></span>
    <span class="count" id="count"></span>
  </div>

  <table id="table">
    <thead>
      <tr>
        <th style="width:24px;"><input type="checkbox" id="selectAll"></th>
        <th>Title / URL</th>
        <th id="thAuthor" class="sortable">Author / Date<span class="sort-indicator"></span></th>
        <th id="thCategory" class="sortable" title="Click to group by category (items with multiple categories appear once per group)">Category<span class="sort-indicator"></span></th>
        <th>Note</th>
        <th id="thSaved" class="sortable">Saved<span class="sort-indicator"></span></th>
        <th style="width:110px;">Actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none;">No saved pages yet.</div>

  <script src="vendor/browser-polyfill.min.js"></script>
  <script src="common.js"></script>
  <script src="list.js"></script>
</body>
</html>
