<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; padding: 10px; width: 320px; }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 4px 6px; }
  button { margin-top: 8px; padding: 4px 10px; }
  #status { margin-top: 6px; font-size: 12px; color: green; height: 14px; }
  p { font-size: 11px; color: #666; }
</style>
</head>
<body>
  <label for="filename">Markdown filename</label>
  <input type="text" id="filename" placeholder="tab-notes.md">
  <p>Relative to your Downloads folder. Use a subfolder like <code>notes/tab-notes.md</code> to save it there instead.</p>
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
